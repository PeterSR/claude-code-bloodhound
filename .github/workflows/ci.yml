name: CI

on:
  push:
    branches: [main, first-edition]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install GUI build deps
        # So `go build ./cmd/bloodhound-gui` exercises the same code
        # path the release workflow does — catches GTK / WebKit2GTK
        # breakage on PRs instead of at tag time.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install web deps
        run: cd web && npm ci

      - name: Type-check web
        run: cd web && npm run typecheck

      - name: Build web
        run: cd web && npm run build

      - name: Go vet
        run: go vet -tags prod ./...

      - name: Go build daemon
        run: go build ./cmd/bloodhound

      - name: Go build GUI
        run: go build -tags 'prod production desktop webkit2_41' ./cmd/bloodhound-gui

      - name: Go test
        run: go test ./...
