name: CI

on:
  push:
    branches: [main, first-edition]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        run: cd web && npm ci

      - name: Type-check web
        run: cd web && npm run typecheck

      - name: Build web
        run: cd web && npm run build

      - name: Go vet
        run: go vet -tags prod ./...

      - name: Go build
        run: go build -tags prod ./cmd/bloodhound

      - name: Go test
        run: go test ./...
